# Integration-test master YAML.
#
# Used exclusively by .github/workflows/integration-tests.yml.
# A symlink is created at /tmp/configurator → <workspace>/Samples/Components,
# so all "../configurator/..." paths below resolve correctly under Magento's BP
# (/tmp/magento):
#
#   BP + '/' + '../configurator/TaxRates/taxrates.csv'
#   = /tmp/magento/../configurator/TaxRates/taxrates.csv
#   = /tmp/configurator/TaxRates/taxrates.csv   ✓
#
# Components excluded:
#   - media  — sample data downloads images from placehold.it (unreliable in CI)
#   - sql    — executes arbitrary SQL against the shared CI database

config:
  enabled: 1
  method: code
  sources:
    - ../configurator/Configuration/global.yaml

