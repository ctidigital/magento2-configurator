name: Integration Tests

on:
  push:
    branches: [master, develop, "dev/**"]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC — catches new Magento / Mage-OS releases

jobs:
  integration:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest

    # Experimental jobs (beta) are allowed to fail without blocking PR status.
    continue-on-error: ${{ matrix.experimental || false }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: magento_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # OpenSearch 2.11 is supported by Magento 2.4.6 – 2.4.8 and Mage-OS.
      # Security is disabled so no credentials are needed.
      opensearch:
        image: opensearchproject/opensearch:2.11.0
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10
          --health-start-period=40s

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Magento via Mage-OS public mirror (no repo.magento.com credentials needed) ──

          - label: "Magento 2.4.7 (mirror)"
            project: magento/project-community-edition
            constraint: "2.4.7.*"
            repo-url: "https://mirror.mage-os.org/"
            php: "8.3"

          - label: "Magento 2.4.8 (mirror)"
            project: magento/project-community-edition
            constraint: "2.4.8.*"
            repo-url: "https://mirror.mage-os.org/"
            php: "8.3"

          # Latest beta / RC — update the constraint when a new beta is tagged.
          # This job is allowed to fail.
          - label: "Magento beta (mirror)"
            project: magento/project-community-edition
            constraint: "~2.4@beta"
            stability: "beta"
            repo-url: "https://mirror.mage-os.org/"
            php: "8.4"
            experimental: true

          # ── Official Mage-OS distribution ────────────────────────────────────────────

          - label: "Mage-OS latest"
            project: mage-os/project-community-edition
            constraint: ""
            repo-url: "https://repo.mage-os.org/"
            php: "8.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: >-
            bcmath, ctype, curl, dom, gd, hash, iconv, intl,
            mbstring, openssl, pdo_mysql, simplexml, soap, sockets, xsl, zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=-1

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.label }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.label }}-

      # ── Create the Magento / Mage-OS project skeleton ──────────────────────────────

      - name: Create project (no install)
        run: |
          ARGS=(
            --repository-url="${{ matrix.repo-url }}"
            --no-interaction
            --no-progress
            --no-install
          )
          if [ -n "${{ matrix.stability }}" ]; then
            ARGS+=(--stability="${{ matrix.stability }}")
          fi

          PACKAGE="${{ matrix.project }}"
          if [ -n "${{ matrix.constraint }}" ]; then
            PACKAGE="${PACKAGE}:${{ matrix.constraint }}"
          fi

          composer create-project "${ARGS[@]}" "$PACKAGE" /tmp/magento
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      # ── Wire the configurator extension as a Composer path repository ──────────────
      # The extension lives at $GITHUB_WORKSPACE; we register it as a path repo so
      # the exact checked-out code is tested (symlinked into vendor/).

      - name: Register configurator as path repository
        working-directory: /tmp/magento
        run: |
          composer config repositories.configurator \
            "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":true}}"
          composer require ctidigital/magento2-configurator:@dev \
            --no-update --no-interaction

      # ── Skip packages not needed for the configurator integration test ───────────────
      # The module vendor prefix differs: magento/* on the Mage-OS mirror of Magento,
      # mage-os/* on the native Mage-OS distribution. VENDOR is a literal placeholder
      # in the JSON that sed substitutes before jq merges it into composer.json.

      - name: Mark unused packages as replaced
        working-directory: /tmp/magento
        env:
          REPLACE_EXCLUDE: ${{ matrix.replace-exclude || '[]' }}
          REPLACE_INCLUDE: ${{ matrix.replace-include || '{}' }}
        run: |
          VENDOR=$(echo "${{ matrix.project }}" | cut -d/ -f1)
          REPLACE=$(sed "s|VENDOR/|${VENDOR}/|g" << 'JSON'
          {
            "amzn/amazon-pay-and-login-magento-2-module": "*",
            "amzn/amazon-pay-and-login-with-amazon-core-module": "*",
            "amzn/amazon-pay-module": "*",
            "amzn/amazon-pay-sdk-php": "*",
            "amzn/login-with-amazon-module": "*",
            "astock/stock-api-libphp": "*",
