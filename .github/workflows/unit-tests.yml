name: Unit Tests

on:
  push:
    branches: [master, develop, "dev/**"]
  pull_request:
    branches: [master, develop]

jobs:
  unit-tests:
    name: PHP ${{ matrix.php }} Unit Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install symfony/yaml (production dependency, public Packagist)
        # symfony/yaml is a real production requirement of this extension.
        # We install it into an isolated directory so the test bootstrap can
        # load its autoloader without touching the project's own composer.json
        # or pulling in any Magento packages that need repo.magento.com auth.
        run: |
          mkdir -p .ci-deps
          echo '{"require":{"symfony/yaml":"^7.0"}}' > .ci-deps/composer.json
          composer install --working-dir=.ci-deps --no-interaction --no-scripts --no-plugins

      - name: Download PHPUnit
        run: |
          curl -sL https://phar.phpunit.de/phpunit-10.phar -o phpunit.phar
          php phpunit.phar --version

      - name: Run unit tests
        run: php phpunit.phar --configuration phpunit.xml
